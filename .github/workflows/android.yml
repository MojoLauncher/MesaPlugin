name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug
        mv app/build/outputs/apk/debug/app-debug.apk MJMesaPlugin-debug.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: MJMesaPlugin-debug.apk

